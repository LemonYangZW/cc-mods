name: Release CLI

# 推送 cc-mods@<version> 的 tag 时，通过 npm trusted publishing（OIDC）发布 npx 工具，并创建 GitHub release
on:
  push:
    tags: ['cc-mods@*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub release
      id-token: write # npm trusted publishing 用 OIDC 换取发布凭证
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "cc-mods@$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check the CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          node bin/cc-mods.mjs --help
          node bin/cc-mods.mjs list

      - name: Publish to npm
        run: npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "cc-mods CLI ${GITHUB_REF_NAME#cc-mods@}" --generate-notes
