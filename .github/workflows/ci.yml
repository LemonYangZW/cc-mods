name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate and test each mod
        run: |
          for mod in plugins/*/; do
            echo "::group::${mod}"
            claude plugin validate "$mod"
            claude plugin test "$mod"
            echo "::endgroup::"
          done

      - name: Check the npx CLI
        run: |
          node bin/cc-mods.mjs --help
          node bin/cc-mods.mjs list
